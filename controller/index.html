<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="/css/starter-sample.css" />
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Chair Person Controller</title>

    <style>
      :root {
        color-scheme: light;
        --ink: #25232a;
        --muted: #746e78;
        --panel: #fff;
        --accent: #a47dbc;
        --soft-pink: #fffafd;
        --accent-gradient: linear-gradient(
          100deg,
          #aaaef3 0%,
          #d9a7df 22%,
          #efa9cf 43%,
          #f4ddd3 60%,
          #e7a5d5 80%,
          #aeb5f7 100%
        );
        --danger: #c92a2a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          var(--accent-gradient) top / 100% 7px no-repeat,
          #faf9f7;
        font-family: "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      }

      button,
      input {
        touch-action: manipulation;
      }

      .controller-shell {
        width: min(680px, calc(100% - 32px));
        margin: 0 auto;
        padding: max(32px, env(safe-area-inset-top)) 0 max(32px, env(safe-area-inset-bottom));
      }

      .controller-header {
        margin-bottom: 22px;
        padding: 0 4px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: #896f96;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .controller-title-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.25rem);
        font-weight: 750;
        letter-spacing: -0.035em;
      }

      .controller-mark {
        width: clamp(58px, 12vw, 82px);
        height: auto;
        filter: drop-shadow(0 5px 6px rgba(74, 66, 82, 0.13));
      }

      .lead-copy {
        margin: 10px 0 0;
        color: var(--muted);
      }

      .controller-card {
        padding: 22px;
        border: 1px solid #ded8df;
        border-radius: 16px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgba(66, 57, 72, 0.08);
      }

      .action-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .control-button {
        min-height: 78px;
        padding: 14px 16px;
        border: 1px solid #d9d3da;
        border-radius: 11px;
        color: var(--ink);
        background: #fff;
        font-size: 1rem;
        font-weight: 700;
        box-shadow: 0 3px 9px rgba(61, 51, 68, 0.07);
        transition: transform 140ms ease, background-color 140ms ease;
      }

      .control-button:active {
        transform: scale(0.97);
      }

      .control-button:disabled {
        opacity: 0.55;
      }

      .control-button--draw {
        grid-column: 1 / -1;
        min-height: 98px;
        border: 2px solid transparent;
        background:
          linear-gradient(var(--soft-pink), var(--soft-pink)) padding-box,
          var(--accent-gradient) border-box;
        font-size: 1.15rem;
        box-shadow: 0 5px 14px rgba(177, 126, 172, 0.13);
      }

      .control-button small {
        display: block;
        margin-top: 4px;
        font-size: 0.74rem;
        font-weight: 500;
        opacity: 0.76;
      }

      .threshold-panel {
        margin-top: 18px;
        padding: 18px;
        border: 1px solid #e2dbe2;
        border-radius: 12px;
        background: #fbf8fa;
      }

      .threshold-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      .threshold-heading h2 {
        margin: 0;
        font-size: 1rem;
        font-weight: 800;
      }

      .threshold-heading p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.45;
      }

      .threshold-current {
        flex: 0 0 auto;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid #e4cfe1;
        color: #765980;
        background: #f6eaf3;
        font-size: 0.78rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .threshold-editor {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 112px;
        gap: 10px;
      }

      .threshold-value-control {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 58px;
        min-width: 0;
        border: 1px solid #d8d0d9;
        border-radius: 10px;
        background: #fff;
        overflow: hidden;
      }

      #sensor-threshold {
        width: 100%;
        min-width: 0;
        padding: 10px 14px;
        border: 0;
        color: #202124;
        background: transparent;
        font-size: 1.75rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        text-align: center;
        appearance: textfield;
      }

      #sensor-threshold::-webkit-inner-spin-button,
      #sensor-threshold::-webkit-outer-spin-button {
        margin: 0;
        appearance: none;
      }

      #sensor-threshold:focus {
        outline: 3px solid rgba(207, 149, 198, 0.25);
        outline-offset: -3px;
      }

      .threshold-step-buttons {
        display: grid;
        grid-template-rows: 1fr 1fr;
        border-left: 1px solid #e2d9e1;
      }

      .threshold-step-button {
        min-width: 58px;
        padding: 0;
        border: 0;
        color: #705b79;
        background: #f7f1f6;
        font-size: 0.92rem;
        line-height: 1;
      }

      .threshold-step-button + .threshold-step-button {
        border-top: 1px solid #e2d9e1;
      }

      .threshold-step-button:active {
        background: #eee2ec;
      }

      .threshold-update-button {
        border: 1px solid #e4cadb;
        border-radius: 10px;
        color: #342c37;
        background: var(--soft-pink);
        font-size: 1rem;
        font-weight: 800;
        box-shadow: 0 3px 8px rgba(169, 118, 163, 0.1);
      }

      .threshold-update-button:active {
        transform: scale(0.97);
      }

      .threshold-step-button:disabled,
      .threshold-update-button:disabled,
      #sensor-threshold:disabled {
        opacity: 0.52;
      }

      .controller-status {
        min-height: 1.5em;
        margin: 15px 4px 0;
        color: var(--muted);
        font-size: 0.9rem;
        text-align: center;
      }

      .controller-status[data-state="success"] {
        color: #157347;
      }

      .controller-status[data-state="error"] {
        color: var(--danger);
      }

      .drawing-mode {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        color: #fff;
        background: #090909;
        overflow: hidden;
      }

      .drawing-mode[hidden] {
        display: none;
      }

      .drawing-toolbar {
        position: relative;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
        border-bottom: 1px solid #303030;
        background: #151515;
      }

      .toolbar-button {
        min-height: 44px;
        padding: 9px 14px;
        border: 1px solid #3d3d3d;
        border-radius: 12px;
        color: #fff;
        background: #262626;
        font-weight: 700;
        white-space: nowrap;
      }

      .toolbar-button--danger {
        color: #ffb2b2;
      }

      .toolbar-button--back {
        padding-right: 16px;
        padding-left: 12px;
      }

      .toolbar-title {
        margin-right: auto;
        font-size: 1rem;
        font-weight: 800;
      }

      .pen-control {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 44px;
        padding: 6px 12px;
        border-radius: 12px;
        background: #262626;
      }

      .pen-control label {
        margin: 0;
        font-size: 0.84rem;
        font-weight: 700;
        white-space: nowrap;
      }

      #pen-size {
        width: clamp(110px, 22vw, 210px);
        accent-color: #fff;
      }

      #pen-size-value {
        width: 2.8em;
        color: #c8c8c8;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .canvas-stage {
        position: relative;
        display: grid;
        min-width: 0;
        min-height: 0;
        place-items: center;
        padding: 12px;
        background: #d7d7d7;
        overflow: hidden;
      }

      #drawing-canvas {
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 3 / 4;
        border: 1px solid #fff;
        background: #000;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12);
        cursor: crosshair;
        touch-action: none;
      }

      .drawing-footer {
        position: absolute;
        z-index: 3;
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
      }

      .transfer-button {
        min-width: 180px;
        min-height: 52px;
        padding: 12px 24px;
        border: 4px solid transparent;
        border-radius: 15px;
        color: #211b27;
        background:
          linear-gradient(#fff, #fff) padding-box,
          linear-gradient(
              105deg,
              #9fa9ff 0%,
              #d7a5ed 20%,
              #f28fc8 38%,
              #ffd5ca 52%,
              #ee8bc6 72%,
              #9ea9ff 100%
            )
            border-box;
        font-size: 1rem;
        font-weight: 850;
        letter-spacing: 0.02em;
        box-shadow:
          0 10px 28px rgba(223, 120, 200, 0.38),
          0 0 22px rgba(157, 169, 255, 0.26);
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .transfer-button:active {
        box-shadow:
          0 5px 16px rgba(223, 120, 200, 0.32),
          0 0 14px rgba(157, 169, 255, 0.22);
        transform: scale(0.97);
      }

      .transfer-button:focus-visible {
        outline: 3px solid rgba(239, 143, 200, 0.72);
        outline-offset: 3px;
      }

      .drawing-toast {
        position: absolute;
        z-index: 20;
        right: max(12px, env(safe-area-inset-right));
        bottom: max(82px, calc(env(safe-area-inset-bottom) + 72px));
        left: 50%;
        width: min(640px, calc(100% - 24px));
        max-height: 32vh;
        padding: 13px 42px 13px 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 14px;
        color: #fff;
        background: rgba(28, 28, 30, 0.94);
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.38);
        font-size: 0.9rem;
        line-height: 1.55;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
        transform: translateX(-50%);
        overflow: auto;
        backdrop-filter: blur(12px);
      }

      .drawing-toast::after {
        position: absolute;
        top: 9px;
        right: 13px;
        color: #aaa;
        content: '×';
        font-size: 1.35rem;
        line-height: 1;
      }

      .drawing-toast[hidden] {
        display: none;
      }

      .drawing-toast[data-state="success"] {
        border-color: rgba(64, 210, 126, 0.62);
      }

      .drawing-toast[data-state="error"] {
        border-color: rgba(255, 99, 99, 0.72);
        background: rgba(74, 22, 25, 0.96);
      }

      .swipe-overlay {
        position: absolute;
        z-index: 10;
        inset: 0;
        display: grid;
        place-items: center;
        color: #181818;
        background: rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(9px);
        touch-action: none;
        user-select: none;
      }

      .swipe-overlay[hidden] {
        display: none;
      }

      .overlay-cancel {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        min-height: 44px;
        padding: 9px 17px;
        border: 1px solid rgba(0, 0, 0, 0.16);
        border-radius: 999px;
        color: #222;
        background: rgba(255, 255, 255, 0.74);
        font-weight: 750;
      }

      .overlay-cancel:disabled {
        opacity: 0.35;
      }

      .swipe-content {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        width: min(520px, calc(100% - 48px));
        height: min(760px, calc(100% - 96px));
        text-align: center;
      }

      .swipe-content h2 {
        margin: 0 0 9px;
        font-size: clamp(1.7rem, 5vw, 2.6rem);
        font-weight: 850;
        letter-spacing: -0.04em;
      }

      .swipe-content p {
        margin: 0;
        color: #57575c;
      }

      .swipe-track {
        position: relative;
        width: 100%;
        min-height: 300px;
        margin: 18px auto 0;
      }

      .swipe-arrow {
        position: absolute;
        top: 4px;
        left: 50%;
        color: rgba(0, 0, 0, 0.34);
        font-size: 4rem;
        font-weight: 300;
        transform: translateX(-50%);
      }

      .swipe-destination {
        position: absolute;
        top: 86px;
        left: 50%;
        color: rgba(0, 0, 0, 0.48);
        font-size: 0.82rem;
        font-weight: 750;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      .swipe-preview-card {
        position: absolute;
        bottom: 10px;
        left: 50%;
        width: min(192px, 28vw);
        padding: 7px 7px 9px;
        border: 1px solid rgba(0, 0, 0, 0.18);
        border-radius: 9px;
        color: #27272a;
        background: #fff;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        cursor: grab;
        transform: translate(-50%, var(--preview-offset, 0));
        transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
        touch-action: none;
      }

      .swipe-preview-card canvas {
        display: block;
        width: 100%;
        aspect-ratio: 3 / 4;
        border: 1px solid #d1d1d1;
        background: #000;
        pointer-events: none;
      }

      .swipe-preview-label {
        display: block;
        margin-top: 7px;
        font-size: 0.76rem;
        font-weight: 750;
        line-height: 1.2;
        pointer-events: none;
      }

      .swipe-guide {
        position: absolute;
        right: calc(50% - min(122px, 18vw));
        bottom: 42px;
        font-size: 4.4rem;
        filter: grayscale(1);
        animation: guide-swipe 1.65s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        pointer-events: none;
      }

      .swipe-overlay.is-dragging .swipe-preview-card {
        cursor: grabbing;
        transition: none;
      }

      .swipe-overlay.is-dragging .swipe-guide {
        display: none;
      }

      .swipe-overlay.is-uploading .swipe-track,
      .swipe-overlay.is-complete .swipe-track {
        display: none;
      }

      .upload-spinner {
        display: none;
        width: 54px;
        height: 54px;
        margin: 30px auto 8px;
        border: 5px solid rgba(0, 0, 0, 0.13);
        border-top-color: #181818;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .swipe-overlay.is-uploading .upload-spinner {
        display: block;
      }

      .complete-mark {
        display: none;
        margin: 24px auto 8px;
        color: #16854b;
        font-size: 4.5rem;
        line-height: 1;
      }

      .swipe-overlay.is-complete .complete-mark {
        display: block;
      }

      @keyframes guide-swipe {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        20% {
          opacity: 1;
        }
        75% {
          opacity: 1;
          transform: translateY(-155px);
        }
        100% {
          opacity: 0;
          transform: translateY(-180px);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 720px) {
        .drawing-toolbar {
          flex-wrap: wrap;
        }

        .toolbar-title {
          flex: 1;
          min-width: 0;
        }

        .pen-control {
          order: 2;
          flex: 1;
        }

        .toolbar-button--danger {
          order: 3;
        }

        #pen-size {
          width: 100%;
        }

      }

      @media (max-width: 460px) {
        .threshold-heading {
          display: block;
        }

        .threshold-current {
          display: inline-block;
          margin-top: 10px;
        }

        .threshold-editor {
          grid-template-columns: 1fr;
        }

        .threshold-update-button {
          min-height: 52px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <main class="controller-shell">
      <header class="controller-header">
        <p class="eyebrow">Chair Person</p>
        <div class="controller-title-row">
          <h1>Controller</h1>
          <img class="controller-mark" src="./chair-person.png" alt="Chair Person 의자" />
        </div>
        <p class="lead-copy">전시 중인 이미지를 조작하고 새 그림을 추가할 수 있습니다.</p>
      </header>

      <section class="controller-card" aria-label="Chair Person 컨트롤러">
        <div class="action-grid">
          <button class="control-button control-button--draw" id="open-drawing" type="button">
            그리기 모드
            <small>그린 그림이 Chair Person 디자인으로 표시됩니다</small>
          </button>

          <button class="control-button" id="change" type="button">
            다음 이미지로
            <small>image-change</small>
          </button>

          <button class="control-button" id="fetch" type="button">
            이미지 새로고침
            <small>image-fetch</small>
          </button>
        </div>

        <section class="threshold-panel" aria-labelledby="threshold-title">
          <div class="threshold-heading">
            <div>
              <h2 id="threshold-title">센서 임계값</h2>
              <p>왼쪽 또는 오른쪽 센서 값이 이 값보다 낮아지면 이미지가 표시됩니다.</p>
            </div>
            <span class="threshold-current" id="threshold-current">현재 0.5</span>
          </div>

          <div class="threshold-editor">
            <div class="threshold-value-control">
              <input
                id="sensor-threshold"
                type="number"
                min="0"
                max="5"
                step="0.1"
                value="0.5"
                inputmode="decimal"
                aria-label="센서 임계값"
              />
              <div class="threshold-step-buttons">
                <button
                  class="threshold-step-button"
                  id="increase-threshold"
                  type="button"
                  aria-label="임계값을 0.1 올리기"
                >▲</button>
                <button
                  class="threshold-step-button"
                  id="decrease-threshold"
                  type="button"
                  aria-label="임계값을 0.1 내리기"
                >▼</button>
              </div>
            </div>

            <button class="threshold-update-button" id="update-threshold" type="button">
              업데이트
            </button>
          </div>
        </section>

        <p class="controller-status" id="controller-status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <section class="drawing-mode" id="drawing-mode" aria-label="그리기 모드" hidden>
      <header class="drawing-toolbar">
        <button class="toolbar-button toolbar-button--back" id="close-drawing" type="button">
          &lt; 뒤로
        </button>

        <span class="toolbar-title">그리기 모드</span>

        <div class="pen-control">
          <label for="pen-size">펜 굵기</label>
          <input id="pen-size" type="range" min="2" max="40" value="10" />
          <output id="pen-size-value" for="pen-size">10</output>
        </div>

        <button class="toolbar-button toolbar-button--danger" id="clear-canvas" type="button">
          모두 지우기
        </button>
      </header>

      <div class="canvas-stage">
        <canvas id="drawing-canvas" width="1536" height="2048" aria-label="그림 캔버스"></canvas>
      </div>

      <footer class="drawing-footer">
        <button class="transfer-button" id="start-transfer" type="button">Chair Person으로 전송</button>
      </footer>

      <div
        class="drawing-toast"
        id="drawing-status"
        role="status"
        aria-live="polite"
        aria-label="탭하여 닫기"
        hidden
      ></div>

      <div class="swipe-overlay" id="swipe-overlay" aria-hidden="true" hidden>
        <button class="overlay-cancel" id="cancel-transfer" type="button">뒤로</button>

        <div class="swipe-content">
          <h2 id="swipe-title">위로 스와이프하여 전송</h2>
          <p id="swipe-message">그린 그림을 아래에서 위로 스와이프하세요!</p>

          <div class="swipe-track" aria-hidden="true">
            <div class="swipe-arrow">↑</div>
            <div class="swipe-destination">여기까지 올리면 전송</div>
            <div class="swipe-preview-card" id="swipe-preview">
              <canvas id="swipe-preview-canvas" width="192" height="256"></canvas>
              <span class="swipe-preview-label">이 그림을 위로 스와이프하세요</span>
            </div>
            <div class="swipe-guide">☝︎</div>
          </div>

          <div class="upload-spinner" aria-hidden="true"></div>
          <div class="complete-mark" aria-hidden="true">✓</div>
        </div>
      </div>
    </section>

    <script>
      $(() => {
        // バケット名とobnizの送信先は、展示画面（main）側の設定と一致させる。
        const SUPABASE_URL = 'SUPABASE_URL';
        const SUPABASE_KEY = 'SUPABASE_KEY';
        const STORAGE_BUCKET = 'chair-person-backrest';
        const OBNIZ_MESSAGE_URL = 'https://obniz.com/obniz/XXXX-XXXX/message';
        const SENSOR_THRESHOLD_DEFAULT = 0.5;
        const SENSOR_THRESHOLD_MIN = 0;
        const SENSOR_THRESHOLD_MAX = 5;
        const SENSOR_THRESHOLD_STEP = 0.1;
        const SENSOR_THRESHOLD_UPDATE_PREFIX = 'sensor-threshold-update:';

        const drawingMode = document.getElementById('drawing-mode');
        const canvasStage = document.querySelector('.canvas-stage');
        const canvas = document.getElementById('drawing-canvas');
        const context = canvas.getContext('2d', { alpha: false });
        const penSize = document.getElementById('pen-size');
        const penSizeValue = document.getElementById('pen-size-value');
        const drawingStatus = document.getElementById('drawing-status');
        const controllerStatus = document.getElementById('controller-status');
        const sensorThresholdInput = document.getElementById('sensor-threshold');
        const currentThresholdLabel = document.getElementById('threshold-current');
        const increaseThresholdButton = document.getElementById('increase-threshold');
        const decreaseThresholdButton = document.getElementById('decrease-threshold');
        const updateThresholdButton = document.getElementById('update-threshold');
        const swipeOverlay = document.getElementById('swipe-overlay');
        const swipeTitle = document.getElementById('swipe-title');
        const swipeMessage = document.getElementById('swipe-message');
        const swipePreview = document.getElementById('swipe-preview');
        const swipePreviewCanvas = document.getElementById('swipe-preview-canvas');
        const swipePreviewContext = swipePreviewCanvas.getContext('2d', { alpha: false });
        const cancelTransferButton = document.getElementById('cancel-transfer');

        let isDrawing = false;
        let activeDrawingPointer = null;
        let swipePointer = null;
        let swipeStartY = 0;
        let swipeCurrentY = 0;
        let isUploading = false;
        let supabaseClient = null;
        let toastTimer = null;
        let currentSensorThreshold = SENSOR_THRESHOLD_DEFAULT;

        renderSensorThreshold(currentSensorThreshold);
        resetCanvas();

        $('#change').on('click', async () => {
          await sendControllerMessage('image-change', '다음 이미지로 전환했습니다.');
        });

        $('#fetch').on('click', async () => {
          await sendControllerMessage('image-fetch', '이미지를 새로고침했습니다.');
        });

        increaseThresholdButton.addEventListener('click', () => {
          adjustSensorThreshold(SENSOR_THRESHOLD_STEP);
        });

        decreaseThresholdButton.addEventListener('click', () => {
          adjustSensorThreshold(-SENSOR_THRESHOLD_STEP);
        });

        sensorThresholdInput.addEventListener('change', normalizeSensorThresholdInput);
        sensorThresholdInput.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter') return;

          event.preventDefault();
          updateSensorThreshold();
        });

        updateThresholdButton.addEventListener('click', updateSensorThreshold);

        $('#open-drawing').on('click', () => {
          drawingMode.hidden = false;
          document.body.style.overflow = 'hidden';
          // hidden中は描画領域の大きさが0なので、表示後のフレームで寸法を計算する。
          window.requestAnimationFrame(fitCanvasToStage);
          showDrawingToast('흰색 펜으로 자유롭게 그릴 수 있습니다.', 'info');
        });

        $('#close-drawing').on('click', closeDrawingMode);

        $('#clear-canvas').on('click', () => {
          resetCanvas();
          showDrawingToast('캔버스를 처음 상태로 되돌렸습니다.', 'info');
        });

        drawingStatus.addEventListener('click', hideDrawingToast);

        penSize.addEventListener('input', () => {
          penSizeValue.value = penSize.value;
        });

        canvas.addEventListener('pointerdown', startDrawing);
        canvas.addEventListener('pointermove', continueDrawing);
        canvas.addEventListener('pointerup', finishDrawing);
        canvas.addEventListener('pointercancel', finishDrawing);
        window.addEventListener('resize', fitCanvasToStage);

        if (window.ResizeObserver) {
          const canvasStageObserver = new ResizeObserver(fitCanvasToStage);
          canvasStageObserver.observe(canvasStage);
        }

        $('#start-transfer').on('click', showSwipeOverlay);
        $('#cancel-transfer').on('click', hideSwipeOverlay);

        swipePreview.addEventListener('pointerdown', startSwipe);
        swipePreview.addEventListener('pointermove', continueSwipe);
        swipePreview.addEventListener('pointerup', finishSwipe);
        swipePreview.addEventListener('pointercancel', cancelSwipe);

        /**
         * 1536 × 2048の内部解像度と3:4比率を保ったまま、描画領域へ収まる表示寸法を計算する。
         * 上部ツールバーや余白を除いた実寸を基準に縮小するため、キャンバスが画面下へ
         * はみ出さない。CSS上の表示だけを変え、保存するPNGのピクセル数は変更しない。
         */
        function fitCanvasToStage() {
          const stageStyle = window.getComputedStyle(canvasStage);
          const horizontalPadding = parseFloat(stageStyle.paddingLeft) + parseFloat(stageStyle.paddingRight);
          const verticalPadding = parseFloat(stageStyle.paddingTop) + parseFloat(stageStyle.paddingBottom);
          const availableWidth = canvasStage.clientWidth - horizontalPadding;
          const availableHeight = canvasStage.clientHeight - verticalPadding;

          if (availableWidth <= 0 || availableHeight <= 0) return;

          const displayScale = Math.min(
            availableWidth / canvas.width,
            availableHeight / canvas.height,
            1
          );

          canvas.style.width = `${Math.floor(canvas.width * displayScale)}px`;
          canvas.style.height = `${Math.floor(canvas.height * displayScale)}px`;
        }

        /**
         * キャンバスの全ピクセルを黒で初期化する。
         * CSSの背景色は画像に書き出されないため、黒背景もPNGに含める目的で
         * canvas自体を塗りつぶしている。
         */
        function resetCanvas() {
          context.save();
          context.fillStyle = '#000';
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.restore();
        }

        /**
         * 画面上のポインター座標を、固定解像度（1536 × 2048）の座標へ変換する。
         * iPadの画面サイズや向きが変わっても、位置と見た目の線幅を一致させるため、
         * 表示倍率も一緒に返す。
         */
        function canvasPoint(event) {
          const rect = canvas.getBoundingClientRect();
          return {
            x: (event.clientX - rect.left) * (canvas.width / rect.width),
            y: (event.clientY - rect.top) * (canvas.height / rect.height),
            scale: canvas.width / rect.width,
          };
        }

        /**
         * 指またはApple Pencilによる新しい線を開始する。
         * pointer captureを使い、描画中にキャンバスの縁を少し外れても同じ線を
         * 最後まで追跡できるようにする。
         */
        function startDrawing(event) {
          if (isUploading) return;

          event.preventDefault();
          isDrawing = true;
          activeDrawingPointer = event.pointerId;
          canvas.setPointerCapture(event.pointerId);

          const point = canvasPoint(event);
          context.beginPath();
          context.moveTo(point.x, point.y);
          context.lineTo(point.x + 0.01, point.y + 0.01);
          applyPen(point.scale);
          context.stroke();
        }

        /**
         * 現在描いている一本の線へ、移動先の座標を追加する。
         * 別の指が画面に触れても線が飛ばないよう、開始時と同じpointerだけを扱う。
         */
        function continueDrawing(event) {
          if (!isDrawing || event.pointerId !== activeDrawingPointer) return;

          event.preventDefault();
          const point = canvasPoint(event);
          context.lineTo(point.x, point.y);
          applyPen(point.scale);
          context.stroke();
        }

        /**
         * 描画中の線を終了し、次のpointerdownを新しい線として受け付けられる状態に戻す。
         */
        function finishDrawing(event) {
          if (!isDrawing || event.pointerId !== activeDrawingPointer) return;

          isDrawing = false;
          activeDrawingPointer = null;
          context.closePath();
        }

        /**
         * 白ペンの描画設定を適用する。
         * スライダーの値を画面上の太さとして扱い、表示倍率を掛けて書き出し画像上の
         * 線幅へ変換する。
         */
        function applyPen(displayScale) {
          context.strokeStyle = '#fff';
          context.lineWidth = Number(penSize.value) * displayScale;
          context.lineCap = 'round';
          context.lineJoin = 'round';
        }

        /**
         * お絵描きモードを閉じて通常のコントローラーへ戻る。
         * 描きかけの内容は残し、再び開いたときに続きから描けるようにする。
         * 転送中は処理の中断や二重操作を避けるため閉じない。
         */
        function closeDrawingMode() {
          if (isUploading) return;

          hideSwipeOverlay();
          hideDrawingToast();
          drawingMode.hidden = true;
          document.body.style.overflow = '';
        }

        /**
         * 転送前の確認オーバーレイを表示する。
         * ボタンを押しただけではアップロードせず、意図的な上スワイプをもう一段階
         * 必要にすることで、本番中の誤転送を防ぐ。
         */
        function showSwipeOverlay() {
          if (isUploading) return;

          updateSwipePreview();
          cancelSwipe();
          swipeOverlay.hidden = false;
          swipeOverlay.setAttribute('aria-hidden', 'false');
          swipeOverlay.className = 'swipe-overlay';
          swipeTitle.textContent = '위로 스와이프하여 전송';
          swipeMessage.textContent = '아래 그림을 손가락으로 잡고 위로 움직여 주세요.';
          cancelTransferButton.disabled = false;
          hideDrawingToast();
        }

        /**
         * 現在の作品を縦横それぞれ1/8のプレビューへ複写する。
         * 転送対象そのものを操作させることで、ジェスチャーの開始位置と送る画像を
         * 視覚的に結び付ける。元のキャンバスや保存するPNGの解像度は変更しない。
         */
        function updateSwipePreview() {
          swipePreviewContext.save();
          swipePreviewContext.fillStyle = '#000';
          swipePreviewContext.fillRect(0, 0, swipePreviewCanvas.width, swipePreviewCanvas.height);
          swipePreviewContext.drawImage(
            canvas,
            0,
            0,
            swipePreviewCanvas.width,
            swipePreviewCanvas.height
          );
          swipePreviewContext.restore();
        }

        /**
         * 確認オーバーレイを閉じ、途中のスワイプ状態も破棄する。
         * ネットワーク処理の結果が確定するまでは閉じられない。
         */
        function hideSwipeOverlay(event) {
          if (event) event.stopPropagation();
          if (isUploading) return;

          swipeOverlay.hidden = true;
          swipeOverlay.setAttribute('aria-hidden', 'true');
          cancelSwipe();
        }

        /**
         * 絵のプレビューをつかんだpointerだけを、転送ジェスチャーとして追跡する。
         * オーバーレイの空白部分では開始しないため、意図しない画面スクロールや
         * 偶発的な転送を避けられる。
         */
        function startSwipe(event) {
          if (isUploading || swipePointer !== null) return;
          if (event.pointerType === 'mouse' && event.button !== 0) return;

          event.preventDefault();
          swipePointer = event.pointerId;
          swipeStartY = event.clientY;
          swipeCurrentY = event.clientY;
          swipePreview.setPointerCapture(event.pointerId);
          swipeOverlay.classList.add('is-dragging');
          swipeMessage.textContent = '그림을 위로 움직여 주세요.';
        }

        /**
         * 指の上方向への移動量をプレビューへ反映する。
         * 下方向には動かさず、必要距離に近づいたら案内文で転送可能な状態を知らせる。
         */
        function continueSwipe(event) {
          if (event.pointerId !== swipePointer) return;

          event.preventDefault();
          swipeCurrentY = event.clientY;
          const distance = Math.max(0, swipeStartY - swipeCurrentY);
          const maxDistance = swipeOverlay.getBoundingClientRect().height * 0.62;
          const displayedDistance = Math.min(distance, maxDistance);
          const requiredDistance = getRequiredSwipeDistance();

          swipeOverlay.style.setProperty('--preview-offset', `${-displayedDistance}px`);
          swipeMessage.textContent = distance >= requiredDistance
            ? '손가락을 떼면 전송됩니다.'
            : distance >= requiredDistance * 0.55
              ? '조금만 더 위로!'
              : '그림을 위로 움직여 주세요.';
        }

        /**
         * スワイプ終了時に移動距離を判定し、十分に上へ動いた場合だけ転送を開始する。
         * 小さい画面でも操作可能になるよう、しきい値は画面高に合わせつつ上限を設ける。
         */
        function finishSwipe(event) {
          if (event.pointerId !== swipePointer) return;

          swipeCurrentY = event.clientY;
          const requiredDistance = getRequiredSwipeDistance();
          const distance = swipeStartY - swipeCurrentY;
          cancelSwipe();

          if (distance >= requiredDistance) {
            uploadDrawing();
          } else {
            swipeMessage.textContent = '그림을 조금 더 위까지 움직여 주세요.';
          }
        }

        /**
         * 転送を確定する移動距離を画面高に合わせて決める。
         * iPadでは十分に「送った」と感じられる距離を確保しつつ、小さい画面でも
         * プレビューを画面外まで動かさず完了できる範囲に制限する。
         */
        function getRequiredSwipeDistance() {
          const overlayHeight = swipeOverlay.getBoundingClientRect().height;
          return Math.min(280, Math.max(150, overlayHeight * 0.28));
        }

        /**
         * 未完了またはキャンセルされたスワイプの一時状態を初期化する。
         * 次の操作に前回の移動量やアニメーション位置を持ち越さないために使用する。
         */
        function cancelSwipe() {
          if (swipePointer !== null && swipePreview.hasPointerCapture(swipePointer)) {
            swipePreview.releasePointerCapture(swipePointer);
          }

          swipePointer = null;
          swipeStartY = 0;
          swipeCurrentY = 0;
          swipeOverlay.classList.remove('is-dragging');
          swipeOverlay.style.removeProperty('--preview-offset');
        }

        /**
         * キャンバスをPNGへ変換してSupabaseへ保存し、保存成功後にimage-fetchを送る。
         * 展示画面へ存在しない画像を通知しないよう、アップロードと通知は必ずこの順で行う。
         * 保存後の通知だけ失敗した場合は再アップロードせず、手動更新を案内する。
         */
        async function uploadDrawing() {
          if (isUploading) return;

          let objectName = '';

          isUploading = true;
          cancelTransferButton.disabled = true;
          swipeOverlay.className = 'swipe-overlay is-uploading';
          swipeTitle.textContent = '전송 중입니다';
          swipeMessage.textContent = '이미지 저장이 끝날 때까지 잠시 기다려 주세요.';

          try {
            const imageBlob = await canvasToBlob(canvas);
            objectName = createObjectName();
            const { error } = await getSupabaseClient().storage
              .from(STORAGE_BUCKET)
              .upload(objectName, imageBlob, {
                cacheControl: '3600',
                contentType: 'image/png',
                upsert: false,
              });

            if (error) throw error;

            try {
              await sendObnizMessage('image-fetch');
              showTransferResult(
                '전송되었습니다',
                '최신 이미지로 전환했습니다.',
                '이미지를 전송하고 전시 화면을 최신 이미지로 전환했습니다.',
                'success'
              );
            } catch (messageError) {
              console.error('image-fetch送信エラー:', messageError);
              showTransferResult(
                '이미지를 전송했습니다',
                '전환 알림 전송에 실패했습니다. ‘이미지 새로고침’을 눌러 주세요.',
                '이미지는 전송되었지만 전환 알림 전송에 실패했습니다.',
                'error'
              );
            }
          } catch (uploadError) {
            // 認証情報は含めず、Supabaseが返す診断情報と転送対象だけを記録する。
            const errorDetails = uploadError && typeof uploadError === 'object' ? uploadError : {};
            const errorMessage = formatTransferError(uploadError);
            console.log('画像転送エラー詳細:', {
              name: errorDetails.name || null,
              message: errorDetails.message || String(uploadError),
              status: errorDetails.status || null,
              statusCode: errorDetails.statusCode || null,
              code: errorDetails.code || null,
              bucket: STORAGE_BUCKET,
              objectName: objectName || null,
              error: uploadError,
            });
            isUploading = false;
            cancelTransferButton.disabled = false;
            swipeOverlay.className = 'swipe-overlay';
            swipeTitle.textContent = '전송하지 못했습니다';
            swipeMessage.textContent = errorMessage;
            showDrawingToast(`전송 오류\n${errorMessage}`, 'error', 10000);
          }
        }

        /**
         * 転送結果を一定時間表示し、完了後に操作ロックとオーバーレイを解除する。
         * お絵描きモード自体は閉じず、描いた内容を残したまま次の操作へ戻す。
         */
        function showTransferResult(title, message, statusMessage, statusState) {
          swipeOverlay.className = 'swipe-overlay is-complete';
          swipeTitle.textContent = title;
          swipeMessage.textContent = message;

          window.setTimeout(() => {
            isUploading = false;
            cancelTransferButton.disabled = false;
            hideSwipeOverlay();
            showDrawingToast(statusMessage, statusState, statusState === 'error' ? 8000 : 3500);
          }, 1600);
        }

        /**
         * Supabaseやブラウザから返されたエラーを、画面上で読める短い診断文へ変換する。
         * メッセージに加えてstatusとcodeも表示し、権限・認証・通信のどこで
         * 失敗したかを判断できるようにする。
         */
        function formatTransferError(error) {
          const details = error && typeof error === 'object' ? error : {};
          const parts = [details.message || String(error) || '자세한 내용을 알 수 없는 오류입니다.'];

          if (details.status || details.statusCode) {
            parts.push(`status: ${details.status || details.statusCode}`);
          }

          if (details.code) {
            parts.push(`code: ${details.code}`);
          }

          return parts.join(' / ');
        }

        /**
         * お絵描き画面の通知をトーストとして一定時間だけ表示する。
         * 新しい通知が来た場合は古いタイマーを破棄し、最新の内容を優先する。
         * durationを0にすると、タップされるまで表示を維持する。
         */
        function showDrawingToast(message, state, duration = 3200) {
          window.clearTimeout(toastTimer);
          drawingStatus.textContent = message;
          drawingStatus.dataset.state = state;
          drawingStatus.hidden = false;

          if (duration > 0) {
            toastTimer = window.setTimeout(hideDrawingToast, duration);
          }
        }

        /**
         * 表示中のトーストと自動非表示タイマーを破棄する。
         * トースト自体のタップでも呼ばれるため、利用者は待たずに閉じられる。
         */
        function hideDrawingToast() {
          window.clearTimeout(toastTimer);
          toastTimer = null;
          drawingStatus.hidden = true;
        }

        /**
         * callback形式のcanvas.toBlobを、転送処理からawaitできるPromiseへ変換する。
         * ブラウザが画像を生成できずnullを返した場合は、アップロード前の失敗として扱う。
         */
        function canvasToBlob(targetCanvas) {
          return new Promise((resolve, reject) => {
            targetCanvas.toBlob((blob) => {
              if (blob) {
                resolve(blob);
              } else {
                reject(new Error('캔버스를 이미지로 변환하지 못했습니다.'));
              }
            }, 'image/png');
          });
        }

        /**
         * 新規アップロード専用のオブジェクト名を生成する。
         * 時刻とランダム文字列を含め、既存作品の上書きと同名URLのキャッシュを避ける。
         */
        function createObjectName() {
          const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
          const randomPart = Math.random().toString(36).slice(2, 9);
          return `drawing-${timestamp}-${randomPart}.png`;
        }

        /**
         * Supabaseクライアントを初回転送時にだけ生成し、以降は同じ接続設定を再利用する。
         * お絵描きや既存のobniz操作を、Storage接続の準備より先に使えるよう遅延初期化する。
         */
        function getSupabaseClient() {
          if (!supabaseClient) {
            if (!window.supabase || typeof window.supabase.createClient !== 'function') {
              throw new Error('Supabase SDK를 불러오지 못했습니다.');
            }

            if (SUPABASE_URL === 'SUPABASE_URL' || SUPABASE_KEY === 'SUPABASE_KEY') {
              throw new Error('controller의 Supabase URL 또는 Key가 설정되지 않았습니다.');
            }

            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          }

          return supabaseClient;
        }

        /**
         * 入力欄の値を0.1増減し、0.0〜5.0の範囲へ収める。
         * 未入力や不正な文字列の場合は、controllerで最後に送信した値を基準にする。
         * ここではまだ送信せず、「更新」が押されるまで現在値の表示は変えない。
         */
        function adjustSensorThreshold(amount) {
          const enteredValue = normalizeSensorThreshold(sensorThresholdInput.value);
          const baseValue = enteredValue ?? currentSensorThreshold;
          const adjustedValue = Math.min(
            SENSOR_THRESHOLD_MAX,
            Math.max(SENSOR_THRESHOLD_MIN, baseValue + amount)
          );
          const normalizedValue = normalizeSensorThreshold(adjustedValue);

          sensorThresholdInput.value = normalizedValue.toFixed(1);
        }

        /**
         * 手入力が終わった時点で値を検証し、表示を必ず小数1桁へ揃える。
         * 範囲外や空欄は送信候補に残さず、最後に確定した現在値へ戻す。
         */
        function normalizeSensorThresholdInput() {
          const normalizedValue = normalizeSensorThreshold(sensorThresholdInput.value);

          if (normalizedValue === null) {
            sensorThresholdInput.value = currentSensorThreshold.toFixed(1);
            setControllerStatus('임계값은 0.0~5.0 범위로 입력해 주세요.', 'error');
            return;
          }

          sensorThresholdInput.value = normalizedValue.toFixed(1);
        }

        /**
         * 入力中の閾値を、既存のHTTP Message API経由でmainへ一方向に送る。
         * 送信が成功した値をcontroller側の現在値として表示し、Obnizへ常時接続しない。
         */
        async function updateSensorThreshold() {
          const nextThreshold = normalizeSensorThreshold(sensorThresholdInput.value);

          if (nextThreshold === null) {
            sensorThresholdInput.value = currentSensorThreshold.toFixed(1);
            setControllerStatus('임계값은 0.0~5.0 범위로 입력해 주세요.', 'error');
            return;
          }

          setThresholdControlsDisabled(true);
          setControllerStatus('센서 임계값을 전송하고 있습니다…', 'loading');

          try {
            await sendObnizMessage(createSensorThresholdUpdateMessage(nextThreshold));
            currentSensorThreshold = nextThreshold;
            renderSensorThreshold(currentSensorThreshold);
            setControllerStatus(
              `센서 임계값을 ${currentSensorThreshold.toFixed(1)}로 업데이트했습니다.`,
              'success'
            );
          } catch (error) {
            console.error('センサー閾値送信エラー:', error);
            renderSensorThreshold(currentSensorThreshold);
            setControllerStatus('센서 임계값을 전송하지 못했습니다.', 'error');
          } finally {
            setThresholdControlsDisabled(false);
          }
        }

        /**
         * 閾値をAD入力の範囲内に限定し、送信・表示・判定で共通の小数1桁へ丸める。
         * 空欄、数値でない入力、範囲外の値はnullにして更新処理で拒否する。
         */
        function normalizeSensorThreshold(value) {
          if (typeof value === 'string' && value.trim() === '') return null;

          const numericValue = Number(value);

          if (
            !Number.isFinite(numericValue) ||
            numericValue < SENSOR_THRESHOLD_MIN ||
            numericValue > SENSOR_THRESHOLD_MAX
          ) {
            return null;
          }

          return Math.round(numericValue * 10) / 10;
        }

        /**
         * mainのonmessageが更新イベントと値を分けて読める文字列を組み立てる。
         * 既存のimage系イベントと同じ文字列形式に揃え、値だけを接頭辞の後ろへ付ける。
         */
        function createSensorThresholdUpdateMessage(value) {
          return `${SENSOR_THRESHOLD_UPDATE_PREFIX}${value.toFixed(1)}`;
        }

        /**
         * 確定した現在値を入力欄とラベルへ同時に反映する。
         * 初期表示、更新成功、送信失敗からの復帰で表示が食い違わないよう共通化している。
         */
        function renderSensorThreshold(value) {
          const displayValue = value.toFixed(1);
          sensorThresholdInput.value = displayValue;
          currentThresholdLabel.textContent = `현재 ${displayValue}`;
        }

        /**
         * 閾値の送信中だけ入力と関連ボタンをまとめて無効化する。
         * 送信途中の編集や連打によって、画面表示と送信値の順序が入れ替わるのを防ぐ。
         */
        function setThresholdControlsDisabled(disabled) {
          sensorThresholdInput.disabled = disabled;
          increaseThresholdButton.disabled = disabled;
          decreaseThresholdButton.disabled = disabled;
          updateThresholdButton.disabled = disabled;
        }

        /**
         * 通常コントローラーからのobnizメッセージ送信と、ボタン・結果表示をまとめて扱う。
         * 送信中は対象ボタンだけを無効化し、同じ命令の連打を防ぐ。
         */
        async function sendControllerMessage(message, successMessage) {
          const button = message === 'image-change' ? $('#change') : $('#fetch');
          button.prop('disabled', true);
          setControllerStatus('전송하고 있습니다…', 'loading');

          try {
            await sendObnizMessage(message);
            setControllerStatus(successMessage, 'success');
          } catch (error) {
            console.error(`${message}送信エラー:`, error);
            setControllerStatus('메시지를 전송하지 못했습니다.', 'error');
          } finally {
            button.prop('disabled', false);
          }
        }

        /**
         * obnizのMessage APIへのGETリクエストをPromiseとして返す。
         * 呼び出し側が送信完了を待ってから成功表示や次の処理へ進める形にしている。
         */
        function sendObnizMessage(message) {
          return new Promise((resolve, reject) => {
            $.get(OBNIZ_MESSAGE_URL, { data: message })
              .done(resolve)
              .fail(reject);
          });
        }

        /**
         * 通常コントローラーの案内文と表示状態を同時に更新する。
         * data-stateは成功・失敗に応じた色分けに使用する。
         */
        function setControllerStatus(message, state) {
          controllerStatus.textContent = message;
          controllerStatus.dataset.state = state;
        }
      });
    </script>
  </body>
</html>
