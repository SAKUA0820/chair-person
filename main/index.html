<!doctype html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script src="https://unpkg.com/obniz@3.x/obniz.js" crossorigin="anonymous"></script>
	<script src="https://code.jquery.com/jquery-3.4.1.js" integrity="sha256-WpOohJOqMqqyKL9FccASB9O0KwACQJpFTUBLTYOVvVU=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<title>Chair Person</title>
</head>
<body style="margin: 0; background: black">
  <img src="./tie_black.jpg" width="100%" style="opacity: 0;">
<script>
$( async () => {
  // 画像ストレージ系の設定
  const supabaseUrl = 'SUPABASE_URL';
  const supabaseKey = 'SUPABASE_KEY';
  const { createClient } = supabase;
  const supabaseClient = createClient(supabaseUrl, supabaseKey);
  let IMAGES = [];

  const SENSOR_THRESHOLD_DEFAULT = 0.5;
  const SENSOR_THRESHOLD_MIN = 0;
  const SENSOR_THRESHOLD_MAX = 5;
  const SENSOR_THRESHOLD_UPDATE_PREFIX = 'sensor-threshold-update:';
  const OBNIZ_ID = 'OBNIZ_ID_HERE';
  let sensorThreshold = SENSOR_THRESHOLD_DEFAULT;

  // フラグ系
  let currentImg = 0;
  let touchCount = 0;
  let hasBeenFullyShown = false;
  let hasBeenFullyHidden = false;
  // 5回タップで画像差し替え
  // $('body').on('touchend', judgeCount);

  // ストレージ内の画像の取得・配列格納
  IMAGES = await fetchImg();
  console.log('取得した画像:', IMAGES);
  if (IMAGES.length > 0) {
    $('img').attr('src', IMAGES[0]);
  }

	let obniz = new Obniz(OBNIZ_ID);
  console.log(obniz.connectionState)
	
	obniz.onconnect = async () => {

    obniz.onmessage = async (message, from) => {
      if (handleSensorThresholdUpdateMessage(message)) {
        return;
      } else if (message === "image-change") {
        // 画像変更のメッセージを受け取ったら変更する
        changeImg();
      } else if (message === "image-fetch") {
        // 画像再取得のメッセージを受け取ったらfetchする
        IMAGES = await fetchImg();
        console.log('取得した画像:', IMAGES);

        // 再取得時、一番新しいものを表示する
        if (IMAGES.length > 0) {
          currentImg = 0;
          $('img').attr('src', IMAGES[currentImg]);
        }
      }
    };
    
    obniz.io2.output(true);
    obniz.io1.output(false);
    obniz.io9.output(true);
    obniz.io10.output(false);

    let leftRef = 5;
    let rightRef = 5;

    let opacity = 0;

    obniz.repeat(async ()=>{

      leftRef = await obniz.ad11.getWait();
      rightRef = await obniz.ad0.getWait();
      console.log(leftRef + ',' + rightRef);
      
      if((leftRef < sensorThreshold) || (rightRef < sensorThreshold)){
        //opacityを少しずつ足していく
        opacity += 0.2;
        //opacity1以上なら1にする
        if(opacity >= 1){
          opacity = 1;
          hasBeenFullyShown = true;
        }
        // $('img').show();
        $('img').css('opacity', opacity);
      }else{
        //opacityを少しずつ減らしていく
        opacity -= 0.2;
        //opacity0以下なら0にする
        if(opacity <= 0){
          opacity = 0;
          // すでに一度画像表示後であれば、非表示フラグをtrueにする
          if(hasBeenFullyShown) {
            hasBeenFullyHidden = true;
          }
        }
        // $('img').hide();
        $('img').css('opacity', opacity);
      }

      // 一度、表示→非表示になった場合、画像をランダムで変える
      if(hasBeenFullyShown && hasBeenFullyHidden){
        hasBeenFullyShown = false;
        hasBeenFullyHidden = false;
        let nextImgIndex = Math.floor(Math.random() * IMAGES.length);
        changeImage(nextImgIndex);
      } 
      
   }, 200);
	}

  // function judgeCount(){
  //   // 初回タップだったらタイマー発動
  //   if(touchCount === 0){
  //     setTimeout(() => {
  //       touchCount = 0;
  //     }, 5000);
  //   } else if(touchCount >= 5){
  //     // 5秒間の間に5タップしたら画像変更
  //     changeImg();
  //     touchCount = 0;
  //   }
  //   touchCount++;
  // }

  // 画像の取得・格納
  async function fetchImg(){
    const { data, error } = await supabaseClient.storage
      .from('chair-person-backrest')
      .list('', { sortBy: { column: 'created_at', order: 'desc' } });

    if (error) {
      console.error('画像取得エラー:', error);
      return ['./tie_black.jpg', './glass_black.jpg', './scurf_black.jpg'];
    }

    const images = data.map(file =>
      `${supabaseUrl}/storage/v1/object/public/chair-person-backrest/${file.name}`
    );

    return images;
  }

  /**
   * controllerから届いた閾値更新イベントを、mainが判定に使う変数へ適用する。
   * 既存の画像操作メッセージと区別できる接頭辞を使い、不正な値では現在値を
   * 上書きしない。閾値更新イベントであれば、値が不正な場合もtrueを返す。
   */
  function handleSensorThresholdUpdateMessage(message) {
    if (typeof message !== 'string' || !message.startsWith(SENSOR_THRESHOLD_UPDATE_PREFIX)) {
      return false;
    }

    const receivedValue = message.slice(SENSOR_THRESHOLD_UPDATE_PREFIX.length);
    const nextThreshold = normalizeSensorThreshold(receivedValue);

    if (nextThreshold === null) {
      console.warn('無効なセンサー閾値を受信しました:', receivedValue);
      return true;
    }

    sensorThreshold = nextThreshold;
    console.log(`センサー閾値を${sensorThreshold.toFixed(1)}に更新しました。`);
    return true;
  }

  /**
   * 閾値をAD入力の範囲内に限定し、画面表示と判定で共通の小数1桁へ丸める。
   * 数値へ変換できない値や範囲外の値はnullにして、呼び出し側で拒否できるようにする。
   */
  function normalizeSensorThreshold(value) {
    if (typeof value === 'string' && value.trim() === '') return null;

    const numericValue = Number(value);

    if (
      !Number.isFinite(numericValue) ||
      numericValue < SENSOR_THRESHOLD_MIN ||
      numericValue > SENSOR_THRESHOLD_MAX
    ) {
      return null;
    }

    return Math.round(numericValue * 10) / 10;
  }

  // 順番に画像を変える
  function changeImg() {
    console.log(`change image to the next`);
    currentImg++;
    if(currentImg >= IMAGES.length) {
      currentImg = 0;
    }
    $('img').attr('src', IMAGES[currentImg]);
  }

  // 特定の画像に変える
  function changeImage(index) {
    if (index >= IMAGES.length) return;

    console.log(`change image to ${index}`);
    currentImg = index;
    $('img').attr('src', IMAGES[currentImg]);
  }
});	
</script>
</body>
</html>
